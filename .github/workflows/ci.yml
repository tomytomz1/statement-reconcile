name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      PARSER_PROVIDER: none
      PARSER_DETERMINISTIC_ONLY: "1"
      RATE_LIMIT_PROVIDER: memory
      E2E_MOCK_PAYMENTS: "1"
      EXPORT_SEAL_SECRET: ci-seal-secret-not-used-anywhere-real
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan
        run: |
          set +e
          hits=$(git grep -I -l -E 'sk_live_[A-Za-z0-9]|rk_live_[A-Za-z0-9]|STRIPE_SECRET_KEY=sk' -- ':!.env.example' ':!.github/workflows/ci.yml' || true)
          set -e
          if [ -n "$hits" ]; then
            echo "Secret scan failed. Matching files (names only):"
            echo "$hits"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests with coverage thresholds
        # Runs coverage rather than plain `test` so the per-module thresholds in
        # vitest.config.mts are enforced in CI, not only when someone remembers locally.
        # A regression in reconciliation, verification, pack identity, the payment
        # boundary, or the security headers fails the build here.
        run: pnpm test:coverage

      - name: Synthetic release benchmark
        run: pnpm benchmark:synthetic

      - name: SEO audit
        run: pnpm audit:seo

      - name: Production dependency audit
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
